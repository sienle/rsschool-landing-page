<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Coffee House</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <a href="#" class="header__logo">
          <img src="./src/assets/logo.png" alt="logo" />
        </a>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="#favorite-coffee" class="header__nav-link action"
                >Favorite coffee</a
              >
            </li>
            <li class="header__nav-item">
              <a href="#about" class="header__nav-link action">About</a>
            </li>
            <li class="header__nav-item">
              <a href="#mobile-app" class="header__nav-link action"
                >Mobile app</a
              >
            </li>
            <li class="header__nav-item">
              <a href="#footer" class="header__nav-link action">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <div class="theme-toggler">
            <div class="theme-item sun">
              <img src="./src/assets/Sun.png" alt="sun" class="theme-img" />
            </div>
            <div class="theme-item moon">
              <img src="./src/assets/Moon.png" alt="" class="theme-img">
            </div>
          </div>
          <a class="menu-link">
            <span class="action">Menu</span>
            <img src="./src/assets/coffee-cup.png" alt="coffee cup" class="menu-img">
          </a>
        </div>
      </div>
    </header>
    <main>
      <section id="hero"></section>
      <section id="favorite-coffee"></section>
      <section id="about"></section>
      <section id="mobile-app"></section>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
